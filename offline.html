<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>Prestacar Services — Mode hors ligne</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080b14;color:#f7f8fc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 0,rgba(255,36,72,.17),transparent 42%),#080b14}
    main{width:min(100%,520px);padding:clamp(24px,6vw,42px);border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.035);text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.3)}
    .mark{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border:2px solid #ff2448;border-radius:18px;color:#ff536e;font-size:28px;font-weight:900}
    h1{margin:0 0 12px;font-size:clamp(24px,5vw,34px);line-height:1.18}p{color:#b9c2d4;font-size:14px;line-height:1.75}
    nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:22px 0}
    a,button{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:11px 16px;border:1px solid rgba(255,255,255,.17);border-radius:12px;color:#fff;text-decoration:none;font:inherit;font-size:13px;font-weight:750;background:rgba(255,255,255,.06);cursor:pointer}
    a.primary,button.primary{border-color:transparent;background:linear-gradient(135deg,#ff2448,#ff654d)}
    a:focus-visible,button:focus-visible{outline:3px solid #ff8c9f;outline-offset:3px}
    @media(prefers-reduced-motion:no-preference){main{animation:enter .35s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">P</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Cette page n’est pas encore disponible hors ligne. Vérifiez votre connexion puis réessayez, ou retournez vers une page Prestacar déjà enregistrée sur cet appareil.</p>
    <nav aria-label="Langues">
      <a class="primary" href="./fr/">Français</a>
      <a href="./en/">English</a>
      <a href="./es/">Español</a>
    </nav>
    <button type="button" onclick="window.location.reload()">Réessayer</button>
  </main>
</body>
</html>
