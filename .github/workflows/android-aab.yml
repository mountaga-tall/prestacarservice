name: Build Prestacar Android App Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-aab.yml"
      - "manifest.json"
      - "icons/prestacar-maskable.svg"
      - "android/twa-manifest.json"

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed Android AAB
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The legacy "tools" SDK package no longer exists in current SDK repositories.
          packages: platform-tools

      - name: Install Android 16 build platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Install Bubblewrap CLI
        run: npm install --global @bubblewrap/cli

      - name: Configure Bubblewrap toolchain
        run: |
          # Bubblewrap's SDK helper still checks the legacy $ANDROID_HOME/tools path.
          # Link it to the current cmdline-tools installation on GitHub's Ubuntu runner.
          if [ ! -d "$ANDROID_HOME/tools" ]; then
            CMDLINE_TOOLS_DIR="$(find "$ANDROID_HOME/cmdline-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
            test -n "$CMDLINE_TOOLS_DIR"
            ln -s "$CMDLINE_TOOLS_DIR" "$ANDROID_HOME/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          bubblewrap doctor

      - name: Validate the live PWA against TWA quality criteria
        run: |
          # Lighthouse 11.7.1 is pinned because it still contains Bubblewrap's PWA
          # category; Lighthouse 12 removed that category.
          npx --yes lighthouse@11.7.1 https://prestacarservice.com/fr/ \
            --only-categories=performance,pwa,accessibility \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path=./lighthouse-report.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('lighthouse-report.json', 'utf8'));
          const performance = report.categories?.performance?.score;
          const pwa = report.categories?.pwa?.score;

          if (typeof performance !== 'number' || typeof pwa !== 'number') {
            throw new Error('Lighthouse report is missing the required performance or PWA category.');
          }

          console.log('Lighthouse mobile performance:', Math.round(performance * 100));
          console.log('Lighthouse PWA score:', Math.round(pwa * 100));

          const printAudit = (audit) => {
            console.log('- ' + audit.title + ': ' + (audit.displayValue || 'score ' + audit.score));
            if (audit.description) {
              console.log('  ' + audit.description.replace(/\\[.*?\\]\\(.*?\\)/g, '').slice(0, 300));
            }
          };

          const pwaFailures = (report.categories.pwa.auditRefs || [])
            .map((ref) => report.audits[ref.id])
            .filter((audit) => audit && audit.score !== null &&
              audit.score < 1 && audit.scoreDisplayMode !== 'notApplicable');

          if (pwaFailures.length) {
            console.log('PWA checks to fix:');
            pwaFailures.forEach(printAudit);
          }

          const performanceFailures = (report.categories.performance.auditRefs || [])
            .filter((ref) => ref.weight > 0)
            .map((ref) => ({ weight: ref.weight, audit: report.audits[ref.id] }))
            .filter((item) => item.audit && item.audit.score !== null &&
              item.audit.score < 1 && item.audit.scoreDisplayMode !== 'notApplicable')
            .sort((a, b) => b.weight - a.weight)
            .slice(0, 8);

          if (performanceFailures.length) {
            console.log('Highest-impact performance opportunities:');
            performanceFailures.forEach((item) => printAudit(item.audit));
          }

          if (performance < 0.8 || pwa < 1) {
            throw new Error('TWA quality criteria not met: performance must be at least 80 and PWA must be 100.');
          }

          console.log('PWA meets Bubblewrap TWA thresholds.');
          NODE

      - name: Upload Lighthouse report for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prestacar-lighthouse-report
          path: lighthouse-report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Android project from TWA configuration
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade

      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing secret: ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "Missing secret: ANDROID_KEY_ALIAS" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "Missing secret: ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$ANDROID_KEY_PASSWORD" || (echo "Missing secret: ANDROID_KEY_PASSWORD" && exit 1)

      - name: Restore private upload keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
          test -s upload-key.jks

      - name: Build signed APK and App Bundle
        working-directory: android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation \
            --signingKeyPath=upload-key.jks \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

      - name: Upload Android release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prestacar-android-release
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
            lighthouse-report.json
          if-no-files-found: error
          retention-days: 14
