name: Generate official Prestacar PNG icons

on:
  push:
    branches:
      - fix/real-logo-pwa-icons

permissions:
  contents: write

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install image converter
        run: python -m pip install Pillow
      - name: Create square PNG icons from the official logo
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          
          source = Image.open("logo.jpg").convert("RGB")
          gray = ImageOps.grayscale(source)
          # Trim near-white page margins while retaining the coloured logo and dark outlines.
          mask = gray.point(lambda value: 255 if value < 215 else 0)
          bounds = mask.getbbox()
          if bounds is None:
              raise RuntimeError("No logo artwork detected in logo.jpg")
          logo = source.crop(bounds)
          
          for size in (192, 512):
              margin = round(size * 0.04)
              artwork = ImageOps.contain(
                  logo,
                  (size - margin * 2, size - margin * 2),
                  method=Image.Resampling.LANCZOS,
              )
              canvas = Image.new("RGB", (size, size), "white")
              canvas.paste(artwork, ((size - artwork.width) // 2, (size - artwork.height) // 2))
              path = f"icons/prestacar-{size}.png"
              canvas.save(path, format="PNG", optimize=True)
              print(f"Created {path}: {size}x{size}, artwork crop={bounds}")
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/prestacar-192.png icons/prestacar-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace generic PWA icons with official Prestacar logo"
            git push
          else
            echo "PNG icons are already up to date."
          fi
