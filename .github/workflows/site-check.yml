name: Site quality checks

on:
  push:
    branches: [main, fix/site-bug-sweep-pwa-performance]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-site-checks:
    name: Static site and PWA regression checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check shared JavaScript syntax
        run: |
          node --check script.js
          node --check sw.js
      - name: Audit all pages, links, catalogue, and PWA assets
        run: node tests/site-check.cjs
